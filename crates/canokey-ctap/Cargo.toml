[package]
name = "canokey-ctap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Caller-owned CanoKey CTAP/FIDO2 ISO7816 transport envelope"
readme = "README.md"

[features]
default = ["clientpin"]
# ClientPIN protocol v1/v2 cryptography (key agreement, PIN encryption,
# pinUvAuthToken handling). All RustCrypto, pure Rust, caller-supplied
# randomness only.
clientpin = [
    "dep:aes",
    "dep:cbc",
    "dep:hkdf",
    "dep:hmac",
    "dep:p256",
    "dep:sha2",
    "dep:zeroize",
]

[dependencies]
canokey-protocol.workspace = true
aes = { version = "0.8", default-features = false, optional = true }
cbc = { version = "0.1", default-features = false, features = ["block-padding"], optional = true }
hkdf = { version = "0.12", default-features = false, optional = true }
hmac = { version = "0.12", default-features = false, optional = true }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "sha256"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
zeroize = { workspace = true, optional = true }
