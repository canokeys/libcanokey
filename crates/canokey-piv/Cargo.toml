[package]
name = "canokey-piv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
description = "Caller-owned CanoKey PIV protocol operations and certificate parsing"
publish = false

[dependencies]
canokey-protocol.workspace = true
canokey-compat.workspace = true
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
aes = { version = "0.8", features = ["zeroize"] }
des = { version = "0.8", features = ["zeroize"] }
subtle = { version = "2.6", default-features = false }
zeroize.workspace = true
der = { version = "0.7", features = ["alloc", "derive", "oid"] }
spki = { version = "0.7", features = ["alloc"] }
pkcs1 = { version = "0.7", features = ["alloc"] }
p256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
p384 = { version = "0.13", default-features = false, features = ["arithmetic"] }
