[package]
name = "canokey-c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
description = "C ABI for caller-owned CanoKey host protocol operations"
readme = "README.md"
publish = false

[features]
# Preserve the complete standalone C API by default. Embedders can select PIV
# alone to remove unrelated applet factories and erased-operation variants.
default = ["piv", "admin", "oath", "openpgp"]
piv = []
admin = []
oath = []
openpgp = []

[dependencies]
canokey.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
