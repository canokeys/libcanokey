[workspace]
resolver = "2"
members = [
    "crates/canokey-protocol",
    "crates/canokey-compat",
    "crates/canokey-admin",
    "crates/canokey-piv",
    "crates/canokey-key",
    "crates/canokey-openpgp",
    "crates/canokey-oath",
    "crates/canokey-ndef",
    "crates/canokey",
    "crates/canokey-c",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["canokeys.org"]
license = "Apache-2.0"
homepage = "https://canokeys.org"

[workspace.dependencies]
zeroize = "1.8"
thiserror = "2"
canokey-protocol = { path = "crates/canokey-protocol" }
canokey-compat = { path = "crates/canokey-compat" }
canokey-admin = { path = "crates/canokey-admin" }
canokey-oath = { path = "crates/canokey-oath" }
canokey-ndef = { path = "crates/canokey-ndef" }
canokey-key = { path = "crates/canokey-key" }
canokey-openpgp = { path = "crates/canokey-openpgp" }
canokey-piv = { path = "crates/canokey-piv" }
canokey = { path = "crates/canokey" }
x509-info = "0.1.1"
